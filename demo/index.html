<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eigen.js - WebAssembly Linear Algebra Library for JavaScript. Documentation, interactive API examples, and high performance benchmarks.">
  <title>Eigen.js - Linear Algebra for WebAssembly</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Comparison Libraries (Latest Versions) -->
  <script src="https://mlweb.loria.fr/lalolib-module.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml-matrix@6.15.0/matrix.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/linear-algebra@3.1.4/dist/linear-algebra.min.js"></script>

  <!-- Eigen.js WASM Bundle -->
  <script src="dist/index.js"></script>

  <!-- External WASM Engines: OpenBLAS and SuiteSparse (UMFPACK) -->
  <script type="module">
    import { loadOpenBlas } from './vendor/openblas/openblas-loader.js';
    import { loadUmfpack } from './vendor/suitesparse/umfpack-loader.js';

    window.openBlasReady = loadOpenBlas({ print: () => {}, printErr: () => {} })
      .then(ob => { window.openBlas = ob; return ob; })
      .catch(err => console.warn('OpenBLAS load failed:', err));

    window.umfpackReady = loadUmfpack({ print: () => {}, printErr: () => {} })
      .then(uf => { window.umfpack = uf; return uf; })
      .catch(err => console.warn('SuiteSparse load failed:', err));
  </script>
</head>

          <line x1="3" y1="6" x2="21" y2="6"></line>

    <!-- Main Content Area -->

  <script type="module" src="js/app.js"></script>
</body>
</html>
